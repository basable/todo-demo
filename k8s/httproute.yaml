# Only the API: the platform answers every other path from the page in the
# public bucket (objectStorage.website in .basable/config.yaml). A rule here
# for "/" would take the page away from the bucket.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
spec:
  parentRefs:
    - name: tenant-gateway
      namespace: basable-gateway
      sectionName: https
  hostnames:
    - TENANT_DOMAIN_PLACEHOLDER
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: app
          port: 80
